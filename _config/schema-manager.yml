---
Name: schema-manager
---
SilverStripe\CMS\Controllers\ContentController:
  extensions:
    - DorsetDigital\SchemaManager\Extension\SchemaControllerExtension

SilverStripe\SiteConfig\SiteConfig:
  extensions:
    - DorsetDigital\SchemaManager\Extension\SiteConfigSchemaExtension

SilverStripe\Core\Injector\Injector:
  SilverStripe\Control\Director:
    properties:
      Middlewares:
        SchemaResponseMiddleware: '%$DorsetDigital\SchemaManager\Middleware\SchemaResponseMiddleware'

SilverStripe\CMS\Model\SiteTree:
  extensions:
    - DorsetDigital\SchemaManager\Extension\PageSchemaAnnotationExtension
