name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ss_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      SS_ENVIRONMENT_TYPE: test
      SS_DATABASE_CLASS: MySQLDatabase
      SS_DATABASE_SERVER: 127.0.0.1
      SS_DATABASE_PORT: 3306
      SS_DATABASE_NAME: ss_test
      SS_DATABASE_USERNAME: root
      SS_DATABASE_PASSWORD: root
    strategy:
      matrix:
        php-version:
          - '8.3'
          - '8.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2

      - name: Configure Composer plugins
        run: |
          composer config --no-plugins allow-plugins.composer/installers true
          composer config --no-plugins allow-plugins.silverstripe/recipe-plugin true
          composer config --no-plugins allow-plugins.silverstripe/vendor-plugin true

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Create minimal Silverstripe test application
        run: |
          mkdir -p app/src
          cat > app/src/Page.php <<'PHP'
          <?php
          use SilverStripe\CMS\Model\SiteTree;
          class Page extends SiteTree {}
          PHP
          cat > app/src/PageController.php <<'PHP'
          <?php
          use SilverStripe\CMS\Controllers\ContentController;
          class PageController extends ContentController {}
          PHP

      - name: Run tests
        run: vendor/bin/phpunit
